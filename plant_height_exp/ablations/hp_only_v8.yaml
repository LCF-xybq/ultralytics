nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# Ablation: HPModule only (2 HP, no CC) — YOLOv8m variant.
# Isolates HPModule contribution: HP at backbone P3 + neck P3, no CC anywhere.
# HP set is the reduced "lower-impact" version (2 HP at P3 scales only).
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 1, HPModule, [128, 3]]             # 4 HP @ backbone P3
  - [-1, 6, C2f, [256, True]]               # 5 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 6, C2f, [512, True]]               # 7 (neck P4 skip source)
  - [-1, 1, Conv, [1024, 3, 2]]             # 8-P5/32
  - [-1, 3, C2f, [1024, True]]              # 9
  - [-1, 1, SPPF, [1024, 5]]                # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 7], 1, Concat, [1]]               # 12 cat from C2f P4
  - [-1, 3, C2f, [512]]                     # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 5], 1, Concat, [1]]               # 15 cat from C2f P3 (HP-enhanced)
  - [-1, 1, HPModule, [128, 3]]             # 16 HP @ neck P3
  - [-1, 3, C2f, [256]]                     # 17

  - [-1, 1, Conv, [256, 3, 2]]              # 18
  - [[-1, 13], 1, Concat, [1]]              # 19
  - [-1, 3, C2f, [512]]                     # 20

  - [-1, 1, Conv, [512, 3, 2]]              # 21
  - [[-1, 10], 1, Concat, [1]]              # 22
  - [-1, 3, C2f, [1024]]                    # 23

  - [[17, 20, 23], 1, PlantHeightPose, [nc, kpt_shape]]
