nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# Ablation: full (HP + CC) — YOLOv8m variant.
# HP set is the reduced "lower-impact" version (2 HP: backbone P3 + neck P3).
# CC placement matches v2 exactly (backbone P4, P5).
# Difference vs hp_only isolates CC's marginal contribution.
# Difference vs cc_only isolates HP's marginal contribution.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 1, HPModule, [128, 3]]             # 4 HP @ backbone P3
  - [-1, 6, C2f, [256, True]]               # 5 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 6, C2f, [512, True]]               # 7 (neck P4 skip source — raw, bypasses CC)
  - [-1, 1, ColorContrastAttention, [512]]  # 8 CC @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 9-P5/32
  - [-1, 3, C2f, [1024, True]]              # 10
  - [-1, 1, ColorContrastAttention, [1024]] # 11 CC @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 7], 1, Concat, [1]]               # 14 cat from C2f P4 (raw, bypasses CC)
  - [-1, 3, C2f, [512]]                     # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 5], 1, Concat, [1]]               # 17 cat from C2f P3 (HP-enhanced)
  - [-1, 1, HPModule, [128, 3]]             # 18 HP @ neck P3
  - [-1, 3, C2f, [256]]                     # 19

  - [-1, 1, Conv, [256, 3, 2]]              # 20
  - [[-1, 15], 1, Concat, [1]]              # 21
  - [-1, 3, C2f, [512]]                     # 22

  - [-1, 1, Conv, [512, 3, 2]]              # 23
  - [[-1, 12], 1, Concat, [1]]              # 24
  - [-1, 3, C2f, [1024]]                    # 25

  - [[19, 22, 25], 1, PlantHeightPose, [nc, kpt_shape]]
