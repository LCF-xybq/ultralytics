nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# Ablation: full (HP + CC) — YOLO11m variant.
# HP set is the reduced "lower-impact" version (2 HP: backbone P3 + neck P3).
# CC placement matches v2 exactly (backbone P4, P5).
# Difference vs hp_only isolates CC's marginal contribution.
# Difference vs cc_only isolates HP's marginal contribution.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 1, HPModule, [128, 3]]             # 4 HP @ backbone P3
  - [-1, 2, C3k2, [512, False, 0.25]]       # 5 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 2, C3k2, [512, True]]              # 7 (neck P4 skip source — raw, bypasses CC)
  - [-1, 1, ColorContrastAttention, [512]]  # 8 CC @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 10
  - [-1, 1, ColorContrastAttention, [1024]] # 11 CC @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 12
  - [-1, 2, C2PSA, [1024]]                  # 13

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 7], 1, Concat, [1]]               # 15 cat from C3k2 P4 (raw, bypasses CC)
  - [-1, 2, C3k2, [512, False]]             # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 5], 1, Concat, [1]]               # 18 cat from C3k2 P3 (HP-enhanced)
  - [-1, 1, HPModule, [128, 3]]             # 19 HP @ neck P3
  - [-1, 2, C3k2, [256, False]]             # 20

  - [-1, 1, Conv, [256, 3, 2]]              # 21
  - [[-1, 16], 1, Concat, [1]]              # 22
  - [-1, 2, C3k2, [512, False]]             # 23

  - [-1, 1, Conv, [512, 3, 2]]              # 24
  - [[-1, 13], 1, Concat, [1]]              # 25
  - [-1, 2, C3k2, [1024, True]]             # 26

  - [[20, 23, 26], 1, PlantHeightPose, [nc, kpt_shape]]
