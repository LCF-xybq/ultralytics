nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# Ablation: ColorContrastAttention only (2 CC, no HP) — YOLOv8m variant.
# Isolates CC contribution. CC placement matches v2 exactly:
#   - backbone P4, P5 (after C2f).
# Neck P4 skip takes the raw C2f output (bypasses CC) for a clean skip.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 6, C2f, [256, True]]               # 4 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 5-P4/16
  - [-1, 6, C2f, [512, True]]               # 6 (neck P4 skip source — raw, bypasses CC)
  - [-1, 1, ColorContrastAttention, [512]]  # 7 CC @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 8-P5/32
  - [-1, 3, C2f, [1024, True]]              # 9
  - [-1, 1, ColorContrastAttention, [1024]] # 10 CC @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 6], 1, Concat, [1]]               # 13 cat from C2f P4 (raw, bypasses CC)
  - [-1, 3, C2f, [512]]                     # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 15
  - [[-1, 4], 1, Concat, [1]]               # 16 cat from C2f P3
  - [-1, 3, C2f, [256]]                     # 17

  - [-1, 1, Conv, [256, 3, 2]]              # 18
  - [[-1, 14], 1, Concat, [1]]              # 19
  - [-1, 3, C2f, [512]]                     # 20

  - [-1, 1, Conv, [512, 3, 2]]              # 21
  - [[-1, 11], 1, Concat, [1]]              # 22
  - [-1, 3, C2f, [1024]]                    # 23

  - [[17, 20, 23], 1, PlantHeightPose, [nc, kpt_shape]]
