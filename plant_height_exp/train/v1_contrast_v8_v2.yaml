nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  # s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]

# YOLOv8 backbone + ColorContrastAttention v2
# Based on v1, with ColorContrastAttention implementation bugs fixed (see block.py):
#   1. Spatial gate input now includes explicit local-vs-surround diff (c2*3 instead
#      of c2*2). v1 relied on a 1x1 MLP to implicitly learn the subtraction from
#      concat(local, surround), which is hard from random init.
#   2. Output uses residual form x*(1 + spatial_w*channel_w) so attention amplifies
#      rather than attenuates. v1 used x*spatial_w*channel_w which clipped activations
#      to <=x (≈0.25x at sigmoid init).
# Head uses PlantHeightPose so height_mae=True saves best_height_mae.pt.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 6, C2f, [256, True]]               # 4 (neck P3 skip source)
  - [-1, 1, ColorContrastAttention, [256]]  # 5 contrast @ P3
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 6, C2f, [512, True]]               # 7 (neck P4 skip source)
  - [-1, 1, ColorContrastAttention, [512]]  # 8 contrast @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 9-P5/32
  - [-1, 3, C2f, [1024, True]]              # 10
  - [-1, 1, ColorContrastAttention, [1024]] # 11 contrast @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 12

# YOLOv8 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 7], 1, Concat, [1]]               # 14 cat from C2f P4 (raw features)
  - [-1, 3, C2f, [512]]                     # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 4], 1, Concat, [1]]               # 17 cat from C2f P3 (raw features)
  - [-1, 3, C2f, [256]]                     # 18

  - [-1, 1, Conv, [256, 3, 2]]              # 19
  - [[-1, 15], 1, Concat, [1]]              # 20
  - [-1, 3, C2f, [512]]                     # 21

  - [-1, 1, Conv, [512, 3, 2]]              # 22
  - [[-1, 12], 1, Concat, [1]]              # 23
  - [-1, 3, C2f, [1024]]                    # 24

  - [[18, 21, 24], 1, PlantHeightPose, [nc, kpt_shape]]  # PlantHeightPose(P3, P4, P5)
