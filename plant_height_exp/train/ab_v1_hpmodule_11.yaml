nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# YOLO11m backbone + HPModule (port of ab_v1_hpmodule_v8.yaml)
# Same HP placement as the v8 ablation:
#   - HP: backbone P3 (before C3k2), neck P3, neck P4
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 1, HPModule, [128, 3]]             # 4 HP @ P3 (before C3k2)
  - [-1, 2, C3k2, [512, False, 0.25]]       # 5 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 2, C3k2, [512, True]]              # 7 (neck P4 skip source)
  - [-1, 1, Conv, [1024, 3, 2]]             # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 9
  - [-1, 1, SPPF, [1024, 5]]                # 10
  - [-1, 2, C2PSA, [1024]]                  # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 7], 1, Concat, [1]]               # 13 cat from C3k2 P4 (raw)
  - [-1, 1, HPModule, [256, 3]]             # 14 HP @ neck P4
  - [-1, 2, C3k2, [512, False]]             # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 5], 1, Concat, [1]]               # 17 cat from C3k2 P3 (HP-enhanced)
  - [-1, 1, HPModule, [128, 3]]             # 18 HP @ neck P3
  - [-1, 2, C3k2, [256, False]]             # 19

  - [-1, 1, Conv, [256, 3, 2]]              # 20
  - [[-1, 15], 1, Concat, [1]]              # 21
  - [-1, 2, C3k2, [512, False]]             # 22

  - [-1, 1, Conv, [512, 3, 2]]              # 23
  - [[-1, 11], 1, Concat, [1]]              # 24
  - [-1, 2, C3k2, [1024, True]]             # 25

  - [[19, 22, 25], 1, PlantHeightPose, [nc, kpt_shape]]  # PlantHeightPose(P3, P4, P5)
