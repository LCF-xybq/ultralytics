nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  # s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]

# Ablation of v1_hpmodule_colorcontrast_v8 — mirror of v1_hpmodule_colorcontrast_v8_v2.
#
# Where v2 kept ab_v1_hpmodule_v8's HP layout unchanged and added 2 CC at backbone
# P4/P5, this v2' keeps ab_v1_colorcontrast_v8's CC layout unchanged (backbone
# P3/P4/P5) and adds 2 HP at neck P3/P4 (where CC has no presence).
#
# Module placement (CC positions identical to ab_v1_colorcontrast_v8):
#   - CC: backbone P3, P4, P5 (after C2f)
#   - HP: neck P3, neck P4 (NEW additions vs ab)
# No HP at backbone (would conflict with CC at the same scales).
# Head uses PlantHeightPose so height_mae=True saves best_height_mae.pt.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 6, C2f, [256, True]]               # 4
  - [-1, 1, ColorContrastAttention, [256]]  # 5 CC @ P3 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 6, C2f, [512, True]]               # 7 (neck P4 skip source — raw, NOT CC output)
  - [-1, 1, ColorContrastAttention, [512]]  # 8 CC @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 9-P5/32
  - [-1, 3, C2f, [1024, True]]              # 10
  - [-1, 1, ColorContrastAttention, [1024]] # 11 CC @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 12

# YOLOv8 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 7], 1, Concat, [1]]               # 14 cat from C2f P4 (raw, bypasses CC for clean skip)
  - [-1, 1, HPModule, [256, 3]]             # 15 HP @ neck P4 (NEW: refine keypoint edges)
  - [-1, 3, C2f, [512]]                     # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 5], 1, Concat, [1]]               # 18 cat from CC P3 (contrast-enhanced)
  - [-1, 1, HPModule, [128, 3]]             # 19 HP @ neck P3 (NEW: tip precision)
  - [-1, 3, C2f, [256]]                     # 20

  - [-1, 1, Conv, [256, 3, 2]]              # 21
  - [[-1, 16], 1, Concat, [1]]              # 22
  - [-1, 3, C2f, [512]]                     # 23

  - [-1, 1, Conv, [512, 3, 2]]              # 24
  - [[-1, 12], 1, Concat, [1]]              # 25
  - [-1, 3, C2f, [1024]]                    # 26

  - [[20, 23, 26], 1, PlantHeightPose, [nc, kpt_shape]]  # PlantHeightPose(P3, P4, P5)
