nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# YOLO11m backbone + ColorContrastAttention only (port of ab_v1_colorcontrast_v8.yaml).
# Same placement as the v8 ablation:
#   - CC: backbone P3, P4, P5 (after C3k2), no HPModule.
# Head uses PlantHeightPose so height_mae=True saves best_height_mae.pt.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4
  - [-1, 1, ColorContrastAttention, [512]]  # 5 CC @ P3 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 6-P4/16
  - [-1, 2, C3k2, [512, True]]              # 7 (neck P4 skip source)
  - [-1, 1, ColorContrastAttention, [512]]  # 8 CC @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 10
  - [-1, 1, ColorContrastAttention, [1024]] # 11 CC @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 12
  - [-1, 2, C2PSA, [1024]]                  # 13

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 7], 1, Concat, [1]]               # 15 cat from C3k2 P4
  - [-1, 2, C3k2, [512, False]]             # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 17
  - [[-1, 5], 1, Concat, [1]]               # 18 cat from CC P3
  - [-1, 2, C3k2, [256, False]]             # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]              # 20
  - [[-1, 16], 1, Concat, [1]]              # 21
  - [-1, 2, C3k2, [512, False]]             # 22 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]              # 23
  - [[-1, 13], 1, Concat, [1]]              # 24
  - [-1, 2, C3k2, [1024, True]]             # 25 (P5/32-large)

  - [[19, 22, 25], 1, PlantHeightPose, [nc, kpt_shape]]  # PlantHeightPose(P3, P4, P5)
