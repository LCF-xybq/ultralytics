nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  m: [0.50, 1.00, 512]

# YOLO11m backbone + ColorContrastAttention only (ablation of
# v1_hpmodule_colorcontrast_11_v2). Same CC placement as the v2 combined model:
#   - backbone P4, P5 (after C3k2), no HPModule.
# Head uses PlantHeightPose so height_mae=True saves best_height_mae.pt.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 5-P4/16
  - [-1, 2, C3k2, [512, True]]              # 6 (neck P4 skip source — raw, bypasses CC)
  - [-1, 1, ColorContrastAttention, [512]]  # 7 CC @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 9
  - [-1, 1, ColorContrastAttention, [1024]] # 10 CC @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 11
  - [-1, 2, C2PSA, [1024]]                  # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 6], 1, Concat, [1]]               # 14 cat from C3k2 P4 (raw, bypasses CC for clean skip)
  - [-1, 2, C3k2, [512, False]]             # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 4], 1, Concat, [1]]               # 17 cat from C3k2 P3
  - [-1, 2, C3k2, [256, False]]             # 18 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]              # 19
  - [[-1, 15], 1, Concat, [1]]              # 20
  - [-1, 2, C3k2, [512, False]]             # 21 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]              # 22
  - [[-1, 12], 1, Concat, [1]]              # 23
  - [-1, 2, C3k2, [1024, True]]             # 24 (P5/32-large)

  - [[18, 21, 24], 1, PlantHeightPose, [nc, kpt_shape]]  # PlantHeightPose(P3, P4, P5)
