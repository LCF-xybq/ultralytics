nc: 1
names: ['ruler']

nkpt: 4
kpt_shape: [4, 3]
kpt_names: ['up_left', 'up_right', 'down_left', 'tip']

skeleton:
  - [0, 1]
  - [0, 2]
  - [2, 3]
  - [1, 3]

scales:
  # s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]

# YOLOv8 backbone + HPModule + ColorContrastAttention
# Combines the two complementary modules:
#   - HPModule (high-pass + attention): amplifies edges/high-freq detail. Effective
#     at high spatial resolutions where the frequency domain still has physical
#     meaning. Used at backbone P3 (before C2f to give a clean input) and at neck
#     P3/P4 (to refine keypoint edge precision, especially for the tip keypoint).
#   - ColorContrastAttention (local-vs-surround contrast): highlights regions that
#     differ from surroundings, ideal for colored ruler against green plant
#     background. Applied after C2f at every backbone scale (P3/P4/P5) so the
#     ruler signal is amplified throughout the feature hierarchy.
# Total: 3 HPModule + 3 ColorContrastAttention.
# Head uses PlantHeightPose so height_mae=True saves best_height_mae.pt.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 3, C2f, [128, True]]               # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 1, HPModule, [128, 3]]             # 4 HP: suppress bg low-freq before C2f @ P3
  - [-1, 6, C2f, [256, True]]               # 5
  - [-1, 1, ColorContrastAttention, [256]]  # 6 CC: amplify ruler contrast @ P3 (neck P3 skip source)
  - [-1, 1, Conv, [512, 3, 2]]              # 7-P4/16
  - [-1, 6, C2f, [512, True]]               # 8 (neck P4 skip source)
  - [-1, 1, ColorContrastAttention, [512]]  # 9 CC: amplify ruler contrast @ P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 10-P5/32
  - [-1, 3, C2f, [1024, True]]              # 11
  - [-1, 1, ColorContrastAttention, [1024]] # 12 CC: amplify ruler contrast @ P5
  - [-1, 1, SPPF, [1024, 5]]                # 13

# YOLOv8 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 8], 1, Concat, [1]]               # 15 cat from C2f P4 (raw features)
  - [-1, 1, HPModule, [256, 3]]             # 16 HP: refine keypoint edges @ neck P4
  - [-1, 3, C2f, [512]]                     # 17

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 18
  - [[-1, 6], 1, Concat, [1]]               # 19 cat from CC P3 (contrast-enhanced)
  - [-1, 1, HPModule, [128, 3]]             # 20 HP: refine keypoint edges @ neck P3 (tip precision)
  - [-1, 3, C2f, [256]]                     # 21

  - [-1, 1, Conv, [256, 3, 2]]              # 22
  - [[-1, 17], 1, Concat, [1]]              # 23
  - [-1, 3, C2f, [512]]                     # 24

  - [-1, 1, Conv, [512, 3, 2]]              # 25
  - [[-1, 13], 1, Concat, [1]]              # 26
  - [-1, 3, C2f, [1024]]                    # 27

  - [[21, 24, 27], 1, PlantHeightPose, [nc, kpt_shape]]  # PlantHeightPose(P3, P4, P5)
